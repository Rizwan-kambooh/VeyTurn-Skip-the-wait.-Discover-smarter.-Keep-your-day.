services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veyturn
      POSTGRES_USER: veyturn
      POSTGRES_PASSWORD: veyturn-local-password
    ports:
      - "5432:5432"
    volumes:
      - veyturn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyturn -d veyturn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veyturn_postgres_data:

